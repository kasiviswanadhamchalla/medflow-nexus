server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

medflow:
  jwt:
    secret: medflow-secret-key-2024-medflow-secret-key-2024-medflow-secret-key-2024
    expirationMs: 3600000

logging:
  level:
    com.microservices.auth_service: DEBUG
    org.hibernate.SQL: DEBUG
